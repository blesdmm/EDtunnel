name: Obfuscate and Commit

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    
    # 【重要】确保这里有写入权限
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Obfuscate code
        run: npm run obfuscate

      # 使用成熟的自动提交和推送插件，省去手动配 git config 和 push 的麻烦
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Obfuscate _worker.js"
          file_pattern: "_worker.js"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          skip_ci: true # 【关键】自动在 commit 信息中加入 [skip ci]，防止 GitHub Actions 无限循环触发
